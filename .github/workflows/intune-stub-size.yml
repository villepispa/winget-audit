# Fail CI when Intune stubs exceed 50 KB, unit tests fail, or PSA finds issues.
name: intune-stub-size

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stub-size:
    name: Validate (stub + Pester + PSA)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure Pester 5.5+
        shell: pwsh
        run: |
          $pester = Get-Module -ListAvailable -Name Pester |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if (-not $pester -or $pester.Version -lt [version]'5.5.0') {
            Install-Module -Name Pester -MinimumVersion 5.5.0 -Force `
              -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Ensure PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force `
              -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Validate
        shell: pwsh
        run: |
          & ./scripts/Invoke-WgaValidate.ps1 -AgentSummary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
